name: CI & Deploy

# Releases are driven by the version number: pushing a signed tag vX.Y.Z (matching
# package.json and CHANGELOG.md, on main) builds, deploys and publishes a GitHub Release.
# Pushes to main and pull requests run all checks but do not deploy.
#
# A weekly scheduled run re-checks main against newly published vulnerabilities.
#
# Deployment only happens when ALL gates pass:
#   release-check     – tag = package.json version, changelog entry, tag on main, signed tag
#   supply-chain      – lockfile provenance/integrity/licenses, registry signatures, npm audit
#   osv               – OSV-Scanner: lockfile against the OSV database (GitHub, npm, Go, ...)
#   codeql            – static security analysis of the source code and the workflows
#   workflow-security – actionlint (incl. shellcheck) and zizmor for the GitHub workflows
#   secret-scan       – gitleaks over the full git history
#   verify            – lint, type-check, unit tests, reproducible build, build budgets/CSP
#                       check, SBOM, signed build-provenance and SBOM attestations
#   e2e               – Playwright smoke tests and axe accessibility checks (WCAG 2.2 AA) of
#                       the production build, incl. CSP violations and offline mode
# Pull requests additionally run dependency-review for newly added/updated packages.
#
# Only GitHub-owned actions are allowed in this repository. They are pinned to full commit
# SHAs (tag in the comment). The scanners are not actions: they are built from source with Go
# (versions + checksums in .github/tools/*/go.mod/go.sum, verified against the Go checksum
# database) or installed with pip --require-hashes. Dependabot keeps all pins up to date.
# Nothing in this workflow uses a cache: release builds must not be exposed to cache poisoning.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # Mondays – new advisories for unchanged code
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running production deployment; superseded PR runs may be cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail instead of silently using a different Node / npm behaviour.
  NPM_CONFIG_ENGINE_STRICT: 'true'
  NPM_CONFIG_FUND: 'false'

jobs:
  release-check:
    name: Release check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed to check that the tag is on main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Tag matches package.json and CHANGELOG.md
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME does not point to a commit on main"; exit 1; }

      - name: Tag is annotated and its signature is verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME must be an annotated, signed tag (git tag -s)"; exit 1
          fi
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" \
            --jq .verification.verified)"
          if [ "$verified" != true ]; then
            echo "::error::signature of $GITHUB_REF_NAME is not verified by GitHub"; exit 1
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review changed dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Block PRs that introduce known vulnerabilities (runtime and dev).
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          # Licenses currently in use; anything else needs a deliberate decision.
          # (LGPL only comes from sharp/libvips, a dev-only icon tool.)
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0,
            CC0-1.0, CC-BY-4.0, Unlicense, MPL-2.0, LGPL-3.0-or-later
          # Warn (in the job summary) about packages with a low OpenSSF Scorecard.
          warn-on-openssf-scorecard-level: 3

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Runs before anything is installed: registry-only sources, sha512 integrity,
      # lockfile format, licenses of shipped packages.
      - name: Check lockfile and licenses
        run: node scripts/check-dependencies.mjs

      # Exact versions from the lockfile; install scripts disabled (none are needed).
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      # Verifies npm registry signatures and Sigstore provenance attestations.
      - name: Verify registry signatures
        run: npm audit signatures

      # Shipped code must be free of known vulnerabilities of any severity ≥ moderate.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Build tooling must at least be free of high/critical vulnerabilities.
      - name: Audit all dependencies
        run: npm audit --audit-level=high

  osv:
    name: OSV scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .github/tools/osv-scanner/go.mod
          cache: false

      - name: Build OSV-Scanner (pinned in .github/tools/osv-scanner)
        run: go -C .github/tools/osv-scanner build -trimpath -o "$RUNNER_TEMP/bin/" tool

      # Second vulnerability database next to npm audit (GitHub advisories + OSV.dev sources).
      - name: Scan lockfile for known vulnerabilities
        run: |
          "$RUNNER_TEMP/bin/osv-scanner" scan source --lockfile package-lock.json

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .github/tools/actionlint/go.mod
          cache: false

      - name: Build actionlint (pinned in .github/tools/actionlint)
        run: go -C .github/tools/actionlint build -trimpath -o "$RUNNER_TEMP/bin/" tool

      # Syntax, expressions, runner labels, action inputs; shell scripts via shellcheck
      # (preinstalled on the runner).
      - name: actionlint
        run: |
          "$RUNNER_TEMP/bin/actionlint" -color

      - name: Install zizmor (pip, hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --no-deps \
            -r .github/tools/zizmor/requirements.txt

      # Security audit of the workflows and dependabot.yml: injection, excessive permissions, credential
      # persistence, cache poisoning, unpinned or impostor commits, known-vulnerable actions.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --format=github --no-progress .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the complete history, not only the latest commit
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .github/tools/gitleaks/go.mod
          cache: false

      - name: Build gitleaks (pinned in .github/tools/gitleaks)
        run: go -C .github/tools/gitleaks build -trimpath -o "$RUNNER_TEMP/bin/" tool

      # Complements GitHub secret scanning / push protection with gitleaks' rule set; also
      # runs on pull requests from forks before anything is merged.
      - name: Scan git history for secrets
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --verbose .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql

  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore signing of attestations (main only)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build-only

      # Performance budgets, CSP, no source maps or third-party origins, manifest + service worker.
      - name: Check build output
        run: npm run check:dist

      # The build must not modify tracked files (e.g. lockfile drift, stale generated assets).
      - name: Ensure clean working tree
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      # Software bill of materials of everything shipped to users, published with the site
      # at /riddles/sbom.cdx.json.
      - name: Generate SBOM (CycloneDX)
        run: npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > dist/sbom.cdx.json

      # Signed (Sigstore) attestations: which commit and workflow built each deployed file,
      # and which SBOM belongs to it. Verify with `gh attestation verify <file> -R <repo>`.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**'

      - name: Attest SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'dist/**'
          sbom-path: dist/sbom.cdx.json

      - name: Upload SBOM for the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom.cdx.json
          if-no-files-found: error

      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  e2e:
    name: E2E & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run build-only

      # Production build via `vite preview`: smoke tests of every screen (desktop/light and
      # mobile/dark), no console errors or CSP violations, offline start via the service
      # worker, and axe-core checks against WCAG 2.2 A/AA.
      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-check, supply-chain, osv, codeql, workflow-security, secret-scan, verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Create release with changelog notes and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME" --notes > notes.md
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          printf '\n---\n\nDeployed to %s – SBOM attached; build provenance: `gh attestation verify <file> -R %s`\n' \
            "$PAGE_URL" "$GITHUB_REPOSITORY" >> notes.md
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" sbom.cdx.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Riddles $GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"
