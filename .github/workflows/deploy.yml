name: CI & Deploy

# Deployment only happens when ALL gates pass:
#   supply-chain  – lockfile provenance/integrity/licenses, registry signatures, npm audit
#   codeql        – static security analysis of the source code
#   verify        – lint, type-check, unit tests, reproducible build
# Pull requests additionally run dependency-review for newly added/updated packages.
#
# Third-party actions are pinned to full commit SHAs (tag in the comment); Dependabot
# keeps the pins up to date.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running production deployment; superseded PR runs may be cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail instead of silently using a different Node / npm behaviour.
  NPM_CONFIG_ENGINE_STRICT: 'true'
  NPM_CONFIG_FUND: 'false'

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review changed dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Block PRs that introduce known vulnerabilities (runtime and dev).
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          # Licenses currently in use; anything else needs a deliberate decision.
          # (LGPL only comes from sharp/libvips, a dev-only icon tool.)
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0,
            CC0-1.0, CC-BY-4.0, Unlicense, MPL-2.0, LGPL-3.0-or-later
          # Warn (in the job summary) about packages with a low OpenSSF Scorecard.
          warn-on-openssf-scorecard-level: 3

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Runs before anything is installed: registry-only sources, sha512 integrity,
      # lockfile format, licenses of shipped packages.
      - name: Check lockfile and licenses
        run: node scripts/check-dependencies.mjs

      # Exact versions from the lockfile; install scripts disabled (none are needed).
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      # Verifies npm registry signatures and Sigstore provenance attestations.
      - name: Verify registry signatures
        run: npm audit signatures

      # Shipped code must be free of known vulnerabilities of any severity ≥ moderate.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Build tooling must at least be free of high/critical vulnerabilities.
      - name: Audit all dependencies
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql

  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build-only

      # The build must not modify tracked files (e.g. lockfile drift, stale generated assets).
      - name: Ensure clean working tree
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [supply-chain, codeql, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
