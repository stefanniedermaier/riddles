name: CI & Deploy

# Releases are driven by the version number: pushing a signed tag vX.Y.Z (matching
# package.json and CHANGELOG.md, on main) builds, deploys and publishes a GitHub Release.
# Pushes to main and pull requests run all checks but do not deploy.
#
# A weekly scheduled run re-checks main against newly published advisories.
#
# Deployment only happens when ALL gates pass:
#   release-check – tag = package.json version, changelog entry, tag on main, signed tag
#   repo-lint     – workflow lint (actionlint + shellcheck), workflow security (zizmor),
#                   .editorconfig compliance
#   secret-scan   – gitleaks over the full git history
#   supply-chain  – lockfile provenance/integrity/licenses, registry signatures, npm audit,
#                   OSV-Scanner (second vulnerability database incl. malicious packages)
#   codeql        – static security analysis of the source code
#   verify        – lint, type-check, unit tests, unused code/deps (knip), reproducible
#                   build, build-output checks (CSP, no source maps, size budgets), SBOM,
#                   signed build-provenance and SBOM attestations
#   e2e           – end-to-end tests and WCAG 2.2 AA accessibility scans (axe) of the
#                   production build in Chromium (desktop + mobile), offline check
# Pull requests additionally run dependency-review for newly added/updated packages.
#
# Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps the pins up
# to date. CLI tools are pinned with checksums: Go tools via .github/tools/*/go.sum (verified
# against the Go checksum database), zizmor via a hash-locked requirements file.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC – new advisories for unchanged dependencies
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running production deployment; superseded PR runs may be cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fail instead of silently using a different Node / npm behaviour.
  NPM_CONFIG_ENGINE_STRICT: 'true'
  NPM_CONFIG_FUND: 'false'
  # Go tools build with the toolchain pinned in their go.mod (downloaded and verified by Go).
  GOTOOLCHAIN: auto
  GOFLAGS: -trimpath -mod=readonly

jobs:
  release-check:
    name: Release check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed to check that the tag is on main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Tag matches package.json and CHANGELOG.md
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME does not point to a commit on main"; exit 1; }

      - name: Tag is annotated and its signature is verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME must be an annotated, signed tag (git tag -s)"; exit 1
          fi
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" \
            --jq .verification.verified)"
          if [ "$verified" != true ]; then
            echo "::error::signature of $GITHUB_REF_NAME is not verified by GitHub"; exit 1
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review changed dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Block PRs that introduce known vulnerabilities (runtime and dev).
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          # Licenses currently in use; anything else needs a deliberate decision.
          # (LGPL only comes from sharp/libvips, a dev-only icon tool.)
          # The last line is used by the Go modules of the CI tools (.github/tools, never
          # shipped): the Go patent grant, public domain and permissive BSD/MIT variants.
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0,
            CC0-1.0, CC-BY-4.0, Unlicense, MPL-2.0, LGPL-3.0-or-later,
            MIT-0, BSD-2-Clause-Views, LicenseRef-scancode-google-patent-license-golang,
            LicenseRef-scancode-public-domain
          # Dependencies of OSV-Scanner (CI only, never shipped) whose code is Apache-2.0/MIT
          # but that the license scan reports with additional licenses: docs (go-digest:
          # CC-BY-SA-4.0), a logo (fuzzy: CC-BY-3.0), the contributor DCO (image-spec), and
          # tools-golang's dual license "Apache-2.0 OR GPL-2.0-or-later" read as AND (used
          # under Apache-2.0). Exempted by name so these licenses stay disallowed otherwise.
          allow-dependencies-licenses: >-
            pkg:golang/github.com/opencontainers/go-digest,
            pkg:golang/github.com/opencontainers/image-spec,
            pkg:golang/github.com/sahilm/fuzzy,
            pkg:golang/github.com/spdx/tools-golang
          # Warn (in the job summary) about packages with a low OpenSSF Scorecard.
          warn-on-openssf-scorecard-level: 3

  repo-lint:
    name: Workflow & repository lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned actionlint and editorconfig-checker
        run: |
          for tool in actionlint editorconfig-checker; do
            go -C ".github/tools/$tool" build -o "$RUNNER_TEMP/bin/" tool
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Syntax, expressions, runner labels and embedded shell scripts (shellcheck is
      # preinstalled on the runner) of all workflows.
      - name: actionlint
        run: actionlint -color

      # Security audit of the workflows: template injection, excessive permissions,
      # credential persistence, cache poisoning, impostor commits, unpinned or known
      # vulnerable actions (online audits use the read-only token).
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/tools/zizmor/requirements.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --format=github .github/workflows

      # Encoding, line endings, indentation and final newlines as declared in .editorconfig.
      - name: editorconfig-checker
        run: editorconfig-checker

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the complete history, not only the latest commit
          persist-credentials: false

      - name: Build pinned gitleaks
        run: |
          for tool in gitleaks; do
            go -C ".github/tools/$tool" build -o "$RUNNER_TEMP/bin/" tool
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Complements GitHub secret scanning: also covers generic secrets (keys, tokens,
      # passwords) and runs on pull requests from forks before anything is merged.
      - name: gitleaks (full history)
        run: gitleaks git --redact --no-banner --exit-code 1 .

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: jobs of release runs build what is deployed (cache poisoning).
          package-manager-cache: false

      # Runs before anything is installed: registry-only sources, sha512 integrity,
      # lockfile format, licenses of shipped packages.
      - name: Check lockfile and licenses
        run: node scripts/check-dependencies.mjs

      # Exact versions from the lockfile; install scripts disabled (none are needed).
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      # Verifies npm registry signatures and Sigstore provenance attestations.
      - name: Verify registry signatures
        run: npm audit signatures

      # Shipped code must be free of known vulnerabilities of any severity ≥ moderate.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Build tooling must at least be free of high/critical vulnerabilities.
      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Build pinned OSV-Scanner
        run: |
          for tool in osv-scanner; do
            go -C ".github/tools/$tool" build -o "$RUNNER_TEMP/bin/" tool
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Second opinion from osv.dev (GitHub, npm and OpenSSF malicious-package advisories)
      # for every locked package, runtime and dev.
      - name: OSV-Scanner
        run: osv-scanner scan source --lockfile package-lock.json

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      security-events: write # upload CodeQL results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql

  verify:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      id-token: write # Sigstore signing of attestations (main only)
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: jobs of release runs build what is deployed (cache poisoning).
          package-manager-cache: false

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run type-check
      - run: npm test

      # Unused files, dependencies and unlisted/unresolved imports (unused exports: warnings).
      - run: npm run knip

      - run: npm run build-only

      # CSP present, no source maps / eval, PWA files present, gzip size budgets.
      - name: Check build output
        run: npm run check:dist

      # The build must not modify tracked files (e.g. lockfile drift, stale generated assets).
      - name: Ensure clean working tree
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      # Software bill of materials of everything shipped to users, published with the site
      # at /riddles/sbom.cdx.json.
      - name: Generate SBOM (CycloneDX)
        run: npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > dist/sbom.cdx.json

      # Signed (Sigstore) attestations: which commit and workflow built each deployed file,
      # and which SBOM belongs to it. Verify with `gh attestation verify <file> -R <repo>`.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**'

      - name: Attest SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'dist/**'
          sbom-path: dist/sbom.cdx.json

      - name: Upload SBOM for the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom.cdx.json
          if-no-files-found: error

      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  e2e:
    name: E2E & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: jobs of release runs build what is deployed (cache poisoning).
          package-manager-cache: false

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      # Browser version matching the locked @playwright/test.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build-only

      # All pages in light and dark mode on desktop and mobile: renders without console
      # errors, CSP violations or third-party requests, no WCAG 2.2 A/AA violations (axe),
      # navigation, not-found page and offline start via the service worker.
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-check, repo-lint, secret-scan, supply-chain, codeql, verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # authenticate the deployment (OIDC)
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Create release with changelog notes and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME" --notes > notes.md
          printf "\n---\n\nDeployed to %s – SBOM attached; build provenance: \`gh attestation verify <file> -R %s\`\n" \
            "$PAGE_URL" "$GITHUB_REPOSITORY" >> notes.md
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" sbom.cdx.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Riddles $GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"
