<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Riddles</title>
    <meta name="description" content="Sudoku, Crowns and Shapes – puzzle games that work offline." />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Riddles" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the stored theme before the first paint to avoid a light/dark flash.
      try {
        var s = JSON.parse(localStorage.getItem('riddles:settings') || '{}')
        var dark = s.theme === 'dark' ||
          (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Riddles needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
